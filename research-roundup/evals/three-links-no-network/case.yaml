name: three-links-no-network
expected_outcome: |
  The run cannot open the three links and says so. roundup.md is a short-form round-up: a short
  conclusion, a small table of the three items marked as not read, an assignment for two readers
  with concrete questions to answer for each item, the list of what was not done, and open
  questions. It states no facts (numbers, methods, licences, results) about the linked resources,
  labels nothing as 属实 or 有误, and has no empty decision blocks or instruction cards.
